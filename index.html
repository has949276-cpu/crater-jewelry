<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كريتر للذهب والمجوهرات | Crater Jewelry</title>
    <!-- خطوط عربية فاخرة -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-card: #141418;
            --gold-accent: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-border: rgba(212, 175, 55, 0.3);
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --whatsapp-green: #25d366;
            --instagram-color: #e1306c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-light);
            padding-bottom: 30px;
        }

        /* الهيدر والشعار */
        header {
            background: linear-gradient(180deg, #18181c 0%, #0a0a0c 100%);
            border-bottom: 1px solid var(--gold-border);
            padding: 20px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
        }

        .logo-wrap {
            width: 85px;
            height: 85px;
            margin: 0 auto 10px;
            border-radius: 50%;
            border: 2px solid var(--gold-accent);
            overflow: hidden;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 24px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        header p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .store-location {
            font-size: 11px;
            color: var(--gold-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* شريط الأقسام والفلترة */
        .filter-bar {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            padding: 12px 15px;
            overflow-x: auto;
            white-space: nowrap;
            background-color: rgba(20, 20, 24, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            scrollbar-width: none;
        }

        .filter-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gold-border);
            color: var(--text-light);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--gold-gradient);
            color: #000;
            font-weight: bold;
            border-color: transparent;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* شبكة المنتجات */
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .products-container {
                grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
                gap: 20px;
                padding: 20px;
            }
        }

        /* بطاقة المنتج */
        .product-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--gold-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        .img-container {
            position: relative;
            width: 100%;
            padding-top: 110%;
            background-color: #000;
            overflow: hidden;
        }

        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .img-container img {
            transform: scale(1.05);
        }

        .badge-category {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--gold-accent);
            border: 1px solid var(--gold-border);
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        .info-box {
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .item-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .specs-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 11px;
        }

        .spec-tag {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid var(--gold-border);
            color: var(--gold-accent);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* أزرار التواصل */
        .btn-whatsapp {
            background-color: var(--whatsapp-green);
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.3s ease;
        }

        .btn-whatsapp:hover {
            background-color: #1eb954;
        }

        /* الفوتر روابط التواصل */
        footer {
            text-align: center;
            padding: 25px 15px;
            margin-top: 30px;
            border-top: 1px solid var(--gold-border);
            background-color: #0f0f13;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 12px 0;
        }

        .social-btn {
            color: #fff;
            font-size: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gold-border);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-btn.insta { background: rgba(225, 48, 108, 0.2); color: #e1306c; }
        .social-btn.wa { background: rgba(37, 211, 102, 0.2); color: #25d366; }

        .social-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- الهيدر والمعلومات الرسمية لكريتر -->
    <header>
        <div class="logo-wrap">
            <img src="logo.jpg" alt="شعار كريتر للمجوهرات" onerror="this.src='https://via.placeholder.com/100/141418/d4af37?text=CRATER'">
        </div>
        <h1>كريتر للذهب والمجوهرات</h1>
        <p>ذهب يليق بك... وثقةٌ نستحقها ✨</p>
        <div class="store-location">
            <i class="fa-solid fa-location-dot"></i>
            <span>صنعاء - شارع هايل | جولة عشرين</span>
        </div>
    </header>

    <!-- شريط الفلترة والأقسام -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="filter-btn" onclick="filterCategory('rings', this)">خواتم</button>
        <button class="filter-btn" onclick="filterCategory('sets', this)">أطقم</button>
        <button class="filter-btn" onclick="filterCategory('chains', this)">قلائد وسلاسل</button>
    </div>

    <!-- شبكة عرض المنتجات -->
    <div class="products-container" id="productsGrid"></div>

    <!-- الفوتر والتواصل -->
    <footer>
        <p style="font-size: 13px; color: var(--gold-accent);">تواصلوا معنا للحصول على أسعار الذهب اللحظية</p>
        
        <div class="social-links">
            <a href="https://www.instagram.com/cr_xau" target="_blank" class="social-btn insta">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://wa.me/967777062016" target="_blank" class="social-btn wa">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>

        <p style="font-size: 11px; color: var(--text-muted);">جميع الحقوق محفوظة © 2026 <strong>كريتر للمجوهرات</strong></p>
    </footer>

    <script>
        const storeWhatsapp = "967777062016";

        // مصفوفة منتجات محل كريتر مطابقة 100% لأسماء الملفات الجديدة
        const productsList = [
            {
                id: 1,
                title: "خاتم ذهب مخرم فخم",
                category: "rings",
                categoryName: "خواتم",
                karat: "21",
                weight: "6.27",
                image: "6_27g.jpg"
            },
            {
                id: 2,
                title: "خاتم ذهب مربع ملكي",
                category: "rings",
                categoryName: "خواتم",
                karat: "21",
                weight: "5.74",
                image: "5_74g.jpg"
            },
            {
                id: 3,
                title: "خاتم ذهب إيطالي مشبك",
                category: "rings",
                categoryName: "خواتم",
                karat: "21",
                weight: "5.98",
                image: "ring_5_98g.jpg"
            },
            {
                id: 4,
                title: "طقم ذهب متكامل فاخر",
                category: "sets",
                categoryName: "أطقم",
                karat: "21",
                weight: "12.65",
                image: "set_12_65g.jpg"
            },
            {
                id: 5,
                title: "طقم ذهب كلاسيك مثلثات",
                category: "sets",
                categoryName: "أطقم",
                karat: "21",
                weight: "9.27",
                image: "set_9_27g.jpg"
            },
            {
                id: 6,
                title: "طقم ذهب عريض فاخر",
                category: "sets",
                categoryName: "أطقم",
                karat: "21",
                weight: "14.25",
                image: "set_14_25g.jpg"
            },
            {
                id: 7,
                title: "قلادة ذهب مدرجة طويلة",
                category: "chains",
                categoryName: "قلائد",
                karat: "21",
                weight: "غير محدد",
                image: "endant_1.jpg"
            },
            {
                id: 8,
                title: "قلادة ذهب مميزة مع حلق",
                category: "chains",
                categoryName: "قلائد",
                karat: "21",
                weight: "غير محدد",
                image: "ndant_2.jpg"
            }
        ];

        function displayProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const imgFullUrl = window.location.origin + '/' + item.image;

                const waMessage = `السلام عليكم ورحمة الله وبركاته،%0Aأود الاستفسار عن سعر هذه القطعة من *كريتر للمجوهرات*:%0A%0A✨ *اسم القطعة:* ${item.title}%0A🏷️ *العيار:* ${item.karat}%0A⚖️ *الوزن:* ${item.weight} جرام%0A🖼️ *صورة القطعة:* ${imgFullUrl}%0A%0Aكم سعرها اليوم مع المصنعية؟`;

                const linkWA = `https://wa.me/${storeWhatsapp}?text=${waMessage}`;

                const card = `
                    <div class="product-card">
                        <div class="img-container">
                            <span class="badge-category">${item.categoryName}</span>
                            <img src="${item.image}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x350/141418/d4af37?text=كريتر+للمجوهرات'">
                        </div>
                        <div class="info-box">
                            <h3 class="item-title">${item.title}</h3>
                            <div class="specs-row">
                                <span class="spec-tag">عيار ${item.karat}</span>
                                <span class="spec-tag">${item.weight}g</span>
                            </div>
                            <a href="${linkWA}" target="_blank" class="btn-whatsapp">
                                <i class="fa-brands fa-whatsapp"></i>
                                استفسر عن السعر
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(cat === 'all') {
                displayProducts(productsList);
            } else {
                const filtered = productsList.filter(p => p.category === cat);
                displayProducts(filtered);
            }
        }

        window.onload = () => displayProducts(productsList);
    </script>
</body>
</html>
